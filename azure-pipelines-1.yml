trigger:
- main   # or master branch

pool:
  name: Default 
  demands:
    - Agent.Name -equals agent1
  vmImage: 'windows-latest'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'   # Adjust to your .NET version

- script: dotnet restore
  displayName: 'Restore NuGet packages'

- script: dotnet build --configuration Release
  displayName: 'Build Console App'

- script: dotnet test --configuration Release
  displayName: 'Run Unit Tests for FindDuplicateString'

# -------------------------------
# Publish and Deploy to Azure VM
# -------------------------------
- script: dotnet publish --configuration Release -o $(Build.ArtifactStagingDirectory)/publish
  displayName: 'Publish App'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'firstsconnection_WindowsVM_Dotnet'   # <-- your existing service connection
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az vm run-command invoke `
        --resource-group testRG `
        --name prem `
        --command-id RunPowerShellScript `
        --scripts "if (!(Test-Path 'C:\deploy\myapp')) { New-Item -ItemType Directory -Path 'C:\deploy\myapp' | Out-Null }" `
                 "xcopy '$(Build.ArtifactStagingDirectory)\publish\*' 'C:\deploy\myapp' /E /Y" `
                 "cd C:\deploy\myapp" `
                 "dotnet MyApp.dll"
