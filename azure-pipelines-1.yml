trigger:
- main   # or your branch name

pool:
  vmImage: 'windows-latest'

steps:
# Step 1: Restore & Build
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet packages'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration Release'

# Step 2: Publish
- task: DotNetCoreCLI@2
  displayName: 'Publish project'
  inputs:
    command: 'publish'
    publishWebProjects: true
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)/publish'
    zipAfterPublish: false

# Step 3: Copy files to VM
- task: AzureFileCopy@4
  displayName: 'Copy published files to VM'
  inputs:
    SourcePath: '$(Build.ArtifactStagingDirectory)/publish'
    azureSubscription: 'firstsconnection_WindowsVM_Dotnet'   # your service connection
    Destination: 'AzureVMs'
    ResourceGroup: 'testRG'
    VMName: 'prem'
    DestinationFolder: 'C:\deploy\myapp'

# Step 4: Run app on VM
- task: AzureCLI@2
  displayName: 'Run app on VM'
  inputs:
    azureSubscription: 'firstsconnection_WindowsVM_Dotnet'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az vm run-command invoke `
        --resource-group testRG `
        --name prem `
        --command-id RunPowerShellScript `
        --scripts "cd C:\deploy\myapp; dotnet MyApp.dll"
