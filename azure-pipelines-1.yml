trigger:
- main

pool:
  vmImage: 'windows-latest'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'

- script: dotnet restore
  displayName: 'Restore NuGet packages'

- script: dotnet build --configuration Release
  displayName: 'Build Console App'

- script: dotnet test --configuration Release
  displayName: 'Run Unit Tests'

- script: dotnet publish --configuration Release -o $(Build.ArtifactStagingDirectory)/publish
  displayName: 'Publish App'

# Copy published files to Azure VM
- task: AzureFileCopy@4
  inputs:
    SourcePath: '$(Build.ArtifactStagingDirectory)/publish'
    azureSubscription: 'firstsconnection_WindowsVM_Dotnet'
    DestinationType: 'AzureVMs'
    ResourceGroup: 'yourResourceGroup'
    VMName: 'yourVMName'
    TargetPath: 'C:\deploy\myapp'

# Run app on VM (via WinRM or script extension)
- task: PowerShellOnTargetMachines@3
  inputs:
    Machines: 'yourVMName'
    ScriptType: 'InlineScript'
    InlineScript: |
      cd C:\deploy\myapp
      dotnet FindDuplicateString.dll
