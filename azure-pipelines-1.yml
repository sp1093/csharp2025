trigger:
- main   # or master branch

pool:
  name: Default
  demands:
    - Agent.Name -equals agent1
  vmImage: 'windows-latest'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'   # Adjust to your .NET version

- script: dotnet restore
  displayName: 'Restore NuGet packages'

- script: dotnet build --configuration Release
  displayName: 'Build Console App'

- script: dotnet test --configuration Release
  displayName: 'Run Unit Tests for FindDuplicateString'

# -------------------------------
# Publish and Deploy to Azure VM
# -------------------------------
- script: dotnet publish --configuration Release -o $(Build.ArtifactStagingDirectory)/publish
  displayName: 'Publish App'

- task: AzureCLI@2
  inputs:
    azureSubscription: 'firstsconnection_WindowsVM_Dotnet'   # <-- Your service connection name
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Ensure the directory exists on the VM
      if (!(Test-Path 'C:\deploy\myapp')) { 
          New-Item -ItemType Directory -Path 'C:\deploy\myapp' | Out-Null 
      }

      # Copy the published app from the pipeline's artifact staging directory to the VM
      xcopy '$(Build.ArtifactStagingDirectory)\publish\*' 'C:\deploy\myapp' /E /Y

      # Navigate to the app directory on the VM
      cd C:\deploy\myapp

      # Run the application (replace MyApp.dll with your app's DLL name)
      Write-Host "Running MyApp on the Azure VM"
      dotnet MyApp.dll
      displayName: 'Deploy and Run App on Azure VM'

# Optional: You can add additional steps to verify the deployment if needed.
