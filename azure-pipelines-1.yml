trigger:
- main   # or master branch

pool:
  name: Default 
  demands:
    - Agent.Name -equals agent1
  vmImage: 'windows-latest'

steps:
# Install .NET SDK
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'   # Adjust to your .NET version

# Restore NuGet packages
- script: dotnet restore
  displayName: 'Restore NuGet packages'

# Build the app
- script: dotnet build --configuration Release
  displayName: 'Build Console App'

# Run unit tests
- script: dotnet test --configuration Release
  displayName: 'Run Unit Tests for FindDuplicateString'

# Publish the app to an artifact folder
- script: dotnet publish --configuration Release --output $(Build.ArtifactStagingDirectory)
  displayName: 'Publish Console App'

# Publish build artifacts so they can be deployed
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'

# Deploy to Azure VM using WinRM or SSH
- task: AzureCLI@2
  inputs:
    azureSubscription: 'firstsconnection_WindowsVM_Dotnet'
    scriptType: 'ps'
    scriptLocation: 'inlineScript'
    inlineScript: |
      az vm run-command invoke \
        --resource-group testRG \
        --name prem \
        --command-id RunPowerShellScript \
        --scripts "mkdir C:\\MyApp; Write-Output 'Deployment script executed'"

